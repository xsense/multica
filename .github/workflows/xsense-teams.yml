# Fork-only workflow (xsense/multica): verifies the Microsoft Teams adapter and
# publishes the backend + web images that multica-eks deploys.
#
#   push to xsense/**                      → verify (build, vet, tests)
#   push to teams-integration (merge)      → verify + publish images tagged sha-<short>
#                                            + open a PR in xsense/multica-eks bumping the tag
#   tag xsense-v*  (e.g. xsense-v0.7.1-teams.1) → verify + publish images
#     ghcr.io/xsense/multica-backend:<tag>
#     ghcr.io/xsense/multica-web:<tag>
#   workflow_dispatch with publish=true → publish images tagged sha-<short>
name: xsense teams

on:
  push:
    branches: [teams-integration, "xsense/**"]
    tags: ["xsense-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images (tag sha-<short>)"
        type: boolean
        default: false

concurrency:
  group: xsense-teams-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l internal/integrations/teams internal/handler/teams.go cmd/server/router.go internal/handler/handler.go pkg/protocol/events.go)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./internal/integrations/teams/... ./internal/handler/... ./cmd/server/...
      - name: teams tests
        run: go test ./internal/integrations/teams/... -count=1 -race -v
      - name: compile handler and server tests
        run: go test -count=1 -run '^$' ./internal/handler/... ./cmd/server/... ./pkg/protocol/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: typecheck
        run: pnpm exec turbo typecheck --filter=@multica/core --filter=@multica/views --filter=@multica/web
      - name: lint teams files
        run: pnpm --filter @multica/views exec eslint settings/components/teams-tab.tsx settings/components/teams-mark.tsx teams agents/components/tabs/integrations-tab.tsx settings/components/channels-tab.tsx
      - name: locale parity + affected tests
        run: pnpm --filter @multica/views exec vitest run locales teams channels-tab integrations-tab agent-overview-pane use-settings-search
      - name: core tests
        run: pnpm --filter @multica/core exec vitest run api realtime

  images:
    needs: [backend, frontend]
    if: >-
      startsWith(github.ref, 'refs/tags/xsense-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/teams-integration') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: multica-backend, file: Dockerfile, platform: linux/amd64, runner: ubuntu-latest }
          - { image: multica-backend, file: Dockerfile, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: multica-web, file: Dockerfile.web, platform: linux/amd64, runner: ubuntu-latest }
          - { image: multica-web, file: Dockerfile.web, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; else echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
          echo "pair=${{ matrix.image }}-${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=xsense-${{ steps.v.outputs.pair }}
          cache-to: type=gha,mode=max,scope=xsense-${{ steps.v.outputs.pair }}
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            COMMIT=${{ github.sha }}
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ steps.v.outputs.tag }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          touch "/tmp/digests/${{ matrix.image }}/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.v.outputs.pair }}
          path: /tmp/digests/*
          retention-days: 1

  manifests:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="sha-${GITHUB_SHA::7}"; fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in multica-backend multica-web; do
            cd "/tmp/digests/$image"
            docker buildx imagetools create -t "ghcr.io/$owner/$image:$tag" \
              $(printf "ghcr.io/$owner/$image@sha256:%s " *)
            docker buildx imagetools inspect "ghcr.io/$owner/$image:$tag"
          done

  # Opens a PR in xsense/multica-eks that pins the new images (server MULTICA_TAG and
  # the runtime's CLI build ref). Runs only for teams-integration pushes and only
  # when the MULTICA_EKS_TOKEN secret exists (fine-grained PAT on xsense/multica-eks:
  # Contents + Pull requests read/write). Merging that PR deploys.
  bump-eks:
    needs: manifests
    if: github.event_name == 'push' && github.ref == 'refs/heads/teams-integration'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MULTICA_EKS_TOKEN }}
    steps:
      - name: open bump PR
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::MULTICA_EKS_TOKEN not set; bump multica-eks MULTICA_TAG to sha-${GITHUB_SHA::7} by hand."
            exit 0
          fi
          short="${GITHUB_SHA::7}"
          branch="bump/multica-sha-${short}"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/xsense/multica-eks.git" eks
          cd eks
          git checkout -q -b "$branch"
          sed -i -E "s/^(  MULTICA_TAG: )sha-[0-9a-f]+/\1sha-${short}/" .github/workflows/deploy.yml
          if [ -f runtime/Dockerfile ]; then
            sed -i -E "s/^(ARG MULTICA_REF=)[0-9a-f]+/\1${short}/; s/\(sha-[0-9a-f]+ → [0-9a-f]+\)/(sha-${short} → ${short})/" runtime/Dockerfile
          fi
          if git diff --quiet; then echo "already on sha-${short}"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Bump Multica fork image to sha-${short}"
          git push -q origin "$branch"
          gh pr create -R xsense/multica-eks --head "$branch" --base main \
            --title "Bump Multica fork image to sha-${short}" \
            --body "Images \`ghcr.io/xsense/multica-{backend,web}:sha-${short}\` published from xsense/multica@${GITHUB_SHA}.

          Merging deploys the server and rebuilds the agent runtime CLI from the same commit."

